<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=Space+Mono:wght@400;700&amp;family=Outfit:wght@300;400&amp;display=swap');
    </style>
  </defs>
  <rect width="800" height="500" fill="#0c0b06"/>
  <!-- Eyebrow -->
  <text x="400" y="130" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#8a8780" letter-spacing="2">
    <tspan>&#9636;  UNITED STATES FEDERAL GOVERNMENT</tspan>
  </text>
  <!-- Question -->
  <text x="400" y="175" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-size="28" fill="#b0ada5" font-style="italic">Is the government closed?</text>
  <!-- Status chip -->
  <rect x="318" y="200" width="164" height="28" rx="14" fill="#141209" stroke="#92400e" stroke-width="1"/>
  <circle cx="340" cy="214" r="4" fill="#fbbf24"/>
  <text x="356" y="218" font-family="'Space Mono', monospace" font-size="10" fill="#fbbf24" letter-spacing="1.5">PARTIAL SHUTDOWN</text>
  <!-- Answer -->
  <text x="400" y="330" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-size="110" fill="#fbbf24" opacity="0.95">Partially</text>
  <!-- Detail -->
  <text x="400" y="390" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" fill="#b0ada5" font-weight="300">The government has been partially closed since February 14, 2026.</text>
  <!-- Day counter hint -->
  <text x="400" y="440" text-anchor="middle" font-family="'Space Mono', monospace" font-size="36" fill="#fbbf24" font-weight="700">22</text>
  <text x="400" y="460" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#b0ada5" letter-spacing="1">DAYS AND COUNTING</text>
</svg>
