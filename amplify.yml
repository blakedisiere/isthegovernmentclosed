version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        # Create the .amplify-hosting structure for Web Compute (SSR)
        - mkdir -p .amplify-hosting/compute/default
        - mkdir -p .amplify-hosting/static

        # Copy server files into compute bundle
        - cp server.js .amplify-hosting/compute/default/
        - cp package.json .amplify-hosting/compute/default/
        - cp -r src .amplify-hosting/compute/default/
        - cp -r node_modules .amplify-hosting/compute/default/
        - cp -r fonts .amplify-hosting/compute/default/
        - cp -r public .amplify-hosting/compute/default/

        # Copy static assets (served directly by CDN)
        - cp -r public/* .amplify-hosting/static/

        # Create deploy manifest
        - |
          cat > .amplify-hosting/deploy-manifest.json << 'MANIFEST'
          {
            "version": 1,
            "routes": [
              {
                "path": "/index.html",
                "target": { "kind": "Compute", "src": "default" },
                "fallback": { "kind": "Static" }
              },
              {
                "path": "/og-image.png",
                "target": { "kind": "Compute", "src": "default" }
              },
              {
                "path": "/style.css",
                "target": { "kind": "Static" }
              },
              {
                "path": "/app.js",
                "target": { "kind": "Static" }
              },
              {
                "path": "/preview-desktop.png",
                "target": { "kind": "Static" }
              },
              {
                "path": "/preview-mobile.png",
                "target": { "kind": "Static" }
              },
              {
                "path": "/api/*",
                "target": { "kind": "Compute", "src": "default" }
              },
              {
                "path": "/*",
                "target": { "kind": "Compute", "src": "default" },
                "fallback": { "kind": "Static" }
              }
            ],
            "computeResources": [
              {
                "name": "default",
                "entrypoint": "server.js",
                "runtime": "nodejs20.x"
              }
            ],
            "framework": {
              "name": "express",
              "version": "4.22.1"
            }
          }
          MANIFEST
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
